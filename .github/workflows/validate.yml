name: Validate workflows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - name: Enforce production-script coverage floors
        run: npm run test:coverage
      - name: Summarize repository and deployment readiness
        run: npm run --silent readiness >> "$GITHUB_STEP_SUMMARY"
      - run: npm run build:release
      - name: Enforce policy version bumps
        if: github.event_name == 'pull_request'
        run: npm run validate:policy-versions -- "origin/${{ github.base_ref }}"
      - name: Summarize policy changes
        if: github.event_name == 'pull_request'
        run: npm run --silent report:policy-changes -- "origin/${{ github.base_ref }}" >> "$GITHUB_STEP_SUMMARY"
      - name: Replay policy behavior
        if: github.event_name == 'pull_request'
        run: npm run --silent report:policy-impact -- "origin/${{ github.base_ref }}" >> "$GITHUB_STEP_SUMMARY"
      - name: Ensure generated files are committed
        run: git diff --exit-code
