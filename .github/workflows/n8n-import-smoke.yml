name: n8n import compatibility

on:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

jobs:
  matrix:
    name: Load pinned compatibility plan
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.compatibility.outputs.include }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - id: compatibility
        run: echo "include=$(npm run --silent compatibility -- matrix)" >> "${GITHUB_OUTPUT}"

  import:
    name: Import and execute on n8n ${{ matrix.n8n-version }}
    needs: matrix
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.include) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - name: Install isolated n8n CLI
        run: npm install --no-save --package-lock=false "n8n@${{ matrix.n8n-version }}"
      - name: Import every generated workflow
        shell: bash
        run: |
          export N8N_USER_FOLDER="${RUNNER_TEMP}/n8n-${{ matrix.n8n-version }}"
          mkdir -p "${N8N_USER_FOLDER}"
          while IFS= read -r workflow; do
            echo "Importing ${workflow}"
            ./node_modules/.bin/n8n import:workflow --input="${workflow}"
          done < <(find workflows -mindepth 3 -maxdepth 3 -name workflow.json -print | sort)
      - name: Execute representative webhook contract
        shell: bash
        env:
          N8N_USER_FOLDER: ${{ runner.temp }}/n8n-${{ matrix.n8n-version }}
          N8N_PORT: "5691"
          N8N_LISTEN_ADDRESS: 127.0.0.1
          N8N_HOST: 127.0.0.1
          N8N_PROTOCOL: http
          N8N_SECURE_COOKIE: "false"
          N8N_DIAGNOSTICS_ENABLED: "false"
          N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
          N8N_TEMPLATES_ENABLED: "false"
          N8N_PERSONALIZATION_ENABLED: "false"
          N8N_BLOCK_ENV_ACCESS_IN_NODE: "true"
        run: |
          workflow_id="$(node -p "require('./workflows/finance/invoice-exception-triage/workflow.json').id")"
          test -n "${workflow_id}"

          start_n8n() {
            ./node_modules/.bin/n8n start > "${n8n_log}" 2>&1 &
            n8n_pid=$!
            trap 'kill "${n8n_pid}" 2>/dev/null || true; wait "${n8n_pid}" 2>/dev/null || true' EXIT
          }

          wait_for_n8n() {
            for attempt in $(seq 1 60); do
              if curl --fail --silent http://127.0.0.1:5691/healthz >/dev/null; then
                return 0
              fi
              if ! kill -0 "${n8n_pid}" 2>/dev/null; then
                cat "${n8n_log}"
                return 1
              fi
              sleep 1
            done
            cat "${n8n_log}"
            return 1
          }

          wait_for_webhook() {
            for attempt in $(seq 1 60); do
              result="$(curl --silent --output /dev/null --write-out '%{http_code}|%{content_type}' \
                --request POST \
                http://127.0.0.1:5691/webhook/enterprise/finance/invoice-exception-triage \
                --header 'Content-Type: application/json' \
                --data '{}' || true)"
              case "${result}" in
                "400|application/json"*|"500|application/json"*) return 0 ;;
              esac
              if ! kill -0 "${n8n_pid}" 2>/dev/null; then
                cat "${n8n_log}"
                return 1
              fi
              sleep 1
            done
            cat "${n8n_log}"
            return 1
          }

          stop_n8n() {
            kill "${n8n_pid}" 2>/dev/null || true
            wait "${n8n_pid}" 2>/dev/null || true
            trap - EXIT
          }

          ./node_modules/.bin/n8n publish:workflow --id="${workflow_id}"
          n8n_log="${RUNNER_TEMP}/n8n-${{ matrix.n8n-version }}.log"
          start_n8n
          wait_for_n8n
          wait_for_webhook
          if ! npm run smoke:webhook -- http://127.0.0.1:5691 invoice-exception-triage; then
            cat "${n8n_log}"
            exit 1
          fi
          stop_n8n

          ./node_modules/.bin/n8n unpublish:workflow --id="${workflow_id}"
          node scripts/create-runtime-error-probe.mjs \
            workflows/finance/invoice-exception-triage/workflow.json \
            "${RUNNER_TEMP}/invoice-error-probe.json"
          ./node_modules/.bin/n8n import:workflow --input="${RUNNER_TEMP}/invoice-error-probe.json"
          ./node_modules/.bin/n8n publish:workflow --id="${workflow_id}"
          n8n_log="${RUNNER_TEMP}/n8n-${{ matrix.n8n-version }}-error.log"
          start_n8n
          wait_for_n8n
          wait_for_webhook
          if ! npm run smoke:webhook -- http://127.0.0.1:5691 invoice-exception-triage --expect-internal-error; then
            cat "${n8n_log}"
            exit 1
          fi
