name: Publish release

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run verify:release-tag -- "${GITHUB_REF_NAME}"
      - run: npm run check
      - name: Ensure generated files are committed
        run: git diff --exit-code
      - run: npm run build:release
      - name: Verify every internal bundle manifest
        run: for archive in dist/*.tar.gz; do npm run --silent verify:bundle -- "$archive"; done
      - name: Verify release checksums
        working-directory: dist
        run: sha256sum --check SHA256SUMS
      - name: Prove the packaged source is self-validating
        shell: bash
        run: |
          verification_root="$(mktemp -d)"
          tar -xzf dist/n8n-enterprise-workflows-v${GITHUB_REF_NAME#v}.tar.gz -C "${verification_root}"
          packaged_root="${verification_root}/n8n-enterprise-workflows-v${GITHUB_REF_NAME#v}"
          test -f "${packaged_root}/package-lock.json"
          cd "${packaged_root}"
          npm ci --ignore-scripts
          npm run check
      - name: Attest release provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: "dist/*"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}" dist/*
          --verify-tag
          --generate-notes
          --fail-on-no-commits
          --title "n8n Enterprise Workflows ${GITHUB_REF_NAME}"
